<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contact-container {
            /* margin-top: 600px; */
            max-width: 1500px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            padding: 40px;
        }

        /* Form Section */
        .contact-form {
            flex: 1 1 55%;
        }

        .contact-form h2 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .contact-form p {
            margin-bottom: 25px;
            color: #666;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .contact-form button {
            background-color: #3498db;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .contact-form button:hover {
            background-color: #2980b9;
        }

        /* Info Section */
        .contact-info {
            flex: 1 1 40%;
        }

        .contact-info h3 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .contact-info p {
            margin: 12px 0;
            color: #555;
        }

        .contact-info i {
            color: #3498db;
            margin-right: 10px;
        }

        .contact-info iframe {
            margin-top: 50px;
            width: 100%;
            height: 200px;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="contact-container">
        <div class="contact-form">
            <h2>Contact Us</h2>
            <p>Have a question or comment? Send us a message!</p>
            <form>
                <input type="text" placeholder="Your Name" required />
                <input type="email" placeholder="Your Email" required />
                <textarea rows="5" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>

        <div class="contact-info">
            <h3>Get in Touch</h3>
            <p><i class="fas fa-map-marker-alt"></i> 123 Trade St, Market City, USA</p>
            <p><i class="fas fa-phone"></i> +1 234 567 890</p>
            <p><i class="fas fa-envelope"></i> support@tradesphere.com</p>
            <iframe src="https://maps.google.com/maps?q=New York&t=&z=13&ie=UTF8&iwloc=&output=embed" allowfullscreen=""
                loading="lazy">
            </iframe>
        </div>
    </div>
    <script>
        window.addEventListener("load", () => {
            document.body.classList.add("loaded");
        });
    </script>
    <script>
        document.querySelectorAll(".transition-link").forEach(link => {
            link.addEventListener("click", function (e) {
                e.preventDefault();
                document.body.classList.add("fade-out");
                setTimeout(() => {
                    window.location.href = this.href;
                }, 500); // Match the fade-out time
            });
        });
    </script>
    <script>
        // Fade-in when page fully loads
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');

            // Optional: Animate section
            const section = document.getElementById('main-section');
            setTimeout(() => {
                section.classList.add('visible');
            }, 300);
        });
    </script>
</body>

</html>
